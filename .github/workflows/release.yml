name: Release Patches Bundle

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Extract release version from tag
        id: version
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION="${TAG_NAME#v}"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Build patches bundle and catalog
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle build --no-daemon -Pversion="${{ steps.version.outputs.version }}"

      - name: Update patches-bundle.json manifest
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          tag = os.environ["RELEASE_TAG"]
          version = os.environ["RELEASE_VERSION"]
          repo = os.environ["GITHUB_REPOSITORY"]
          bundle_path = "patches-bundle.json"

          with open(bundle_path, "r", encoding="utf-8") as f:
              data = json.load(f)

          data["created_at"] = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%S")
          data["version"] = version
          data["download_url"] = f"https://github.com/{repo}/releases/download/{tag}/patches-{version}.mpp"
          data.setdefault("signature_download_url", "")

          with open(bundle_path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PY

      - name: Commit updated manifest to main if changed
        run: |
          if ! git diff --quiet -- patches-bundle.json patches-list.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git fetch origin main || true
            if git show-ref --verify --quiet refs/remotes/origin/main; then
              git checkout -B release-sync origin/main
              git checkout "${GITHUB_SHA}" -- patches-bundle.json patches-list.json
              git add patches-bundle.json patches-list.json
              git commit -m "chore(release): update bundle manifest for ${{ steps.version.outputs.tag }} [skip ci]" || true
              git push origin HEAD:main || true
            fi
          fi

      - name: Generate SHA256SUMS.txt
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          (
            cd patches/build/libs
            sha256sum "patches-${RELEASE_VERSION}.mpp"
          ) > SHA256SUMS.txt
          sha256sum patches-list.json patches-bundle.json >> SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            patches/build/libs/patches-${{ steps.version.outputs.version }}.mpp
            patches-list.json
            patches-bundle.json
            SHA256SUMS.txt
          generate_release_notes: false
