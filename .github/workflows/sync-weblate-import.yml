name: Compile Weblate Flat Files to Dictionaries

on:
  pull_request:
    branches:
      - main
    paths:
      - "i18n/weblate/*.json"
      - "i18n/lang_helper.py"
      - "i18n/validate_dictionaries.py"
      - ".github/workflows/sync-weblate-import.yml"
  push:
    branches:
      - main
    paths:
      - "i18n/weblate/*.json"
  workflow_dispatch:

concurrency:
  group: weblate-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-flat-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR workspace
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile flat files into workspace lang dictionaries
        run: python3 i18n/lang_helper.py import-flat --all --flat-dir i18n/weblate

      - name: Validate compiled dictionaries and write step summary
        run: python3 i18n/validate_dictionaries.py --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Verify Gradle dictionary gate
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle :patches:validateDictionaries --no-daemon

  compile-flat-to-lang:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        github.actor != 'github-actions[bot]' &&
        !contains(github.event.head_commit.message, '[skip weblate-sync]') &&
        !contains(github.event.head_commit.message, '[skip ci]')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.WEBLATE_SYNC_PAT || github.token }}

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile flat files into 4-table lang dictionaries
        run: python3 i18n/lang_helper.py import-flat --all --flat-dir i18n/weblate

      - name: Validate compiled dictionaries and write step summary
        run: python3 i18n/validate_dictionaries.py --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Verify Gradle dictionary gate
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle :patches:validateDictionaries --no-daemon

      - name: Commit and push compiled lang dictionaries if changed
        run: |
          if [ -z "$(git status --porcelain -- lang)" ]; then
            echo "No compiled lang/*.json changes detected." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- lang
          git commit -m "chore(i18n): compile Weblate flat files into lang [skip weblate-sync] [skip ci]"
          git pull --rebase origin main
          git push
