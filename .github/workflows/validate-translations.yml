name: Validate Translation Dictionaries

on:
  pull_request:
    paths:
      - "lang/**"
      - "i18n/**"
      - "!i18n/weblate/**"
      - "patches/build.gradle.kts"
      - ".github/workflows/validate-translations.yml"
  push:
    branches:
      - main
    paths:
      - "lang/**"
      - "i18n/**"
      - "!i18n/weblate/**"
      - "patches/build.gradle.kts"
      - ".github/workflows/validate-translations.yml"

permissions:
  contents: read

jobs:
  validate-dictionaries:
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.actor != 'github-actions[bot]' &&
        !contains(github.event.head_commit.message, '[skip weblate-sync]') &&
        !contains(github.event.head_commit.message, '[skip ci]')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate translation dictionaries and write step summary
        run: python3 i18n/validate_dictionaries.py --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Verify Gradle dictionary gate
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle :patches:validateDictionaries --no-daemon
