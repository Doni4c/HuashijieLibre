[versions]
morphe-patcher = "2.3.0"
morphe-patches = "2.1.0"
# Required by the app.morphe.patches settings plugin (matches morphe-patcher 2.3.0).
#noinspection GradleDependency
smali = "ac700e1942"
annotation = "1.11.0"
gson = "2.14.0"
kotlin-stdlib = "2.4.21"
guava = "33.7.2-jre"
bouncycastle = "1.86"
jna = "5.19.1"

[libraries]
morphe-patcher = { module = "app.morphe:morphe-patcher", version.ref = "morphe-patcher" }
annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin-stdlib" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }

[plugins]
morphe-patches = { id = "app.morphe.patches", version.ref = "morphe-patches" }
